[tox]
envlist = py{39,310,311,312}, lint, type
skipsdist = True
requires = virtualenv>=20.0.0

[testenv]
allowlist_externals = uv
commands_pre =
    uv pip install -e ".[dev]"
commands =
    uv run pytest tests/ --cov=src --cov-report=term-missing

[testenv:lint]
allowlist_externals = uv
commands_pre =
    uv pip install -e ".[dev]"
commands =
    uv run black --check src/ tests/
    uv run isort --check-only src/ tests/ --profile black --line-length 100
    uv run flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203

[testenv:type]
allowlist_externals = uv
commands_pre =
    uv pip install -e ".[dev]"
commands =
    uv run mypy src/

[testenv:format]
allowlist_externals = uv
commands_pre =
    uv pip install -e ".[dev]"
commands =
    uv run black src/ tests/
    uv run isort src/ tests/ --profile black --line-length 100

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = .git, __pycache__, build, dist, .eggs, *.egg
